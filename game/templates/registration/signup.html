<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
      body {
        background: #1a1a2e;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: #16213e;
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 16px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      }
      .login-title {
        font-weight: 800;
        background: linear-gradient(135deg, #e94560, #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .form-control {
        background: #0f3460;
        border: 1px solid rgba(255,255,255,0.1);
        color: #eaeaea;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .form-control:focus {
        background: #0f3460;
        border-color: #e94560;
        color: #eaeaea;
        box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.25);
      }
      .btn-primary {
        background: #e94560;
        border-color: #e94560;
        border-radius: 8px;
        padding: 10px;
        font-weight: 600;
      }
      .btn-primary:hover { background: #d63851; border-color: #d63851; }
      a { color: #4ecca3; }
      a:hover { color: #3dbb91; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="text-center mb-4">
          <i class="bi bi-cursor-fill" style="font-size: 2.5rem; color: #e94560;"></i>
          <h2 class="login-title mt-2">Chess Gang</h2>
          <p class="text-muted">Create your account</p>
        </div>
        {% if messages %}
          {% for message in messages %}
            <div class="alert {{message.tags}} py-2 small">{{message}}</div>
          {% endfor %}
        {% endif %}
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label for="id_fname" class="form-label small">First Name</label>
            <input type="text" name="fname" id="id_fname" class="form-control" placeholder="First name" required>
          </div>
          <div class="col-6">
            <label for="id_lname" class="form-label small">Last Name</label>
            <input type="text" name="lname" id="id_lname" class="form-control" placeholder="Last name" required>
          </div>
        </div>
        <div class="mb-2">
          <label for="id_username" class="form-label small">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" placeholder="Choose a username" required autofocus>
        </div>
        <div class="mb-2">
          <label for="id_email" class="form-label small">Email</label>
          <input type="email" name="email" id="id_email" class="form-control" placeholder="Email address" required>
        </div>
        <div class="mb-2">
          <label for="id_password" class="form-label small">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" placeholder="Password" required>
        </div>
        <div class="mb-3">
          <label for="id_passwordconf" class="form-label small">Confirm Password</label>
          <input type="password" name="passwordconf" id="id_passwordconf" class="form-control" placeholder="Confirm password" required>
        </div>
        <button class="btn btn-primary w-100 mb-3" type="submit">
          <i class="bi bi-person-plus me-1"></i>Register
        </button>
        <p class="text-center text-muted small mb-0">
          Already have an account? <a href="/accounts/login">Sign in</a>
        </p>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
