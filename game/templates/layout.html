<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>{% block title %}{% endblock %}</title>
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">

    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- jQuery + Bootstrap 5 JS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    {% block cdn %}{% endblock %}

    <style>
      :root {
        --chess-bg: #1a1a2e;
        --chess-surface: #16213e;
        --chess-accent: #0f3460;
        --chess-highlight: #e94560;
        --chess-success: #4ecca3;
        --chess-warning: #f5a623;
        --chess-text: #eaeaea;
        --chess-muted: #8892a4;
      }
      body {
        background: var(--chess-bg);
        color: var(--chess-text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
      }
      .navbar {
        background: var(--chess-surface) !important;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        box-shadow: 0 2px 20px rgba(0,0,0,0.3);
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, var(--chess-highlight), #ff6b6b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .nav-link {
        color: var(--chess-muted) !important;
        transition: color 0.2s;
        font-weight: 500;
      }
      .nav-link:hover, .nav-link.active {
        color: var(--chess-text) !important;
      }
      .btn-primary {
        background: var(--chess-highlight);
        border-color: var(--chess-highlight);
      }
      .btn-primary:hover {
        background: #d63851;
        border-color: #d63851;
      }
      .card {
        background: var(--chess-surface);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
      }
      .alert {
        border-radius: 8px;
      }
      {% block extra_css %}{% endblock %}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="/">
          ♞ Chess Gang
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          {% block navbar %}{% endblock %}
        </div>
      </div>
    </nav>

    <main style="padding-top: 4.5rem;">
      {% if messages %}
        {% for message in messages %}
        <div class="alert {{message.tags}} alert-dismissible fade show mx-3 mt-2" role="alert">
          {{message}}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
      {% endif %}
      {% block body %}{% endblock %}
    </main>
  </body>
</html>
